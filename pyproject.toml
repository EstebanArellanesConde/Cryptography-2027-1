[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-vault-d2"
version = "0.1.0"
description = "D2 authenticated file encryption module using ChaCha20-Poly1305"
requires-python = ">=3.10"
dependencies = ["cryptography>=44.0.0,<47.0.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<10.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
