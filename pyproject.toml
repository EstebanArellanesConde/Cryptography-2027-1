[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-digital-vault"
version = "0.3.0"
description = "Secure Digital Document Vault - ChaCha20-Poly1305 AEAD and Multi-Recipient RSA-OAEP Hybrid Encryption"
requires-python = ">=3.10"
dependencies = ["cryptography>=44.0.0,<47.0.0"]

[project.optional-dependencies]
test = ["pytest>=8.0.0,<10.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
